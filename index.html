<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold9</title>
<meta name="description" content="Fold9 — fold9labs.com">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://fold9labs.com/">
<style>
  :root {
    --ink: #14140f;
    --paper: #efece3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #efece3; --paper: #14140f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 6vmin;
    font-family: system-ui, sans-serif;
  }
  #mark {
    width: min(82vw, 880px);
    height: auto;
    display: block;
    overflow: visible;
  }
  #mark path {
    fill: none;
    stroke: var(--ink);
    stroke-width: 13;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<svg id="mark" viewBox="0 0 460 196" role="img" aria-label="Fold9">
  <title>Fold9</title>
</svg>

<script>
(function () {
  var AMP = 3.4;
  var WAVE = 26;
  var PI = Math.PI;

  function seg(x1, y1, x2, y2, n) {
    var p = [];
    for (var i = 0; i <= n; i++) {
      var t = i / n;
      p.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]);
    }
    return p;
  }

  function arc(cx, cy, rx, ry, a0, a1, n) {
    var p = [];
    for (var i = 0; i <= n; i++) {
      var a = a0 + (a1 - a0) * i / n;
      p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    return p;
  }

  function wobble(pts, phase) {
    var d = [0];
    for (var i = 1; i < pts.length; i++) {
      d.push(d[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    var out = [];
    for (var j = 0; j < pts.length; j++) {
      var a = pts[Math.max(0, j - 1)];
      var b = pts[Math.min(pts.length - 1, j + 1)];
      var tx = b[0] - a[0], ty = b[1] - a[1];
      var len = Math.hypot(tx, ty) || 1;
      var off = AMP * Math.sin(2 * PI * d[j] / WAVE + phase);
      out.push([pts[j][0] - ty / len * off, pts[j][1] + tx / len * off]);
    }
    return out;
  }

  function toPath(p) {
    var s = "M" + p[0][0].toFixed(2) + " " + p[0][1].toFixed(2);
    for (var i = 1; i < p.length; i++) {
      s += "L" + p[i][0].toFixed(2) + " " + p[i][1].toFixed(2);
    }
    return s;
  }

  var letters = [
    { x: 0,   strokes: [seg(0, 0, 0, 100, 40), seg(0, 0, 46, 0, 20), seg(0, 48, 37, 48, 16)] },
    { x: 76,  strokes: [arc(33, 50, 33, 50, 0, 2 * PI, 110)] },
    { x: 172, strokes: [seg(0, 0, 0, 100, 40), seg(0, 100, 44, 100, 20)] },
    { x: 246, strokes: [seg(0, 0, 0, 100, 40), arc(0, 50, 50, 50, -PI / 2, PI / 2, 60)] },
    { x: 326, strokes: [arc(28, 30, 28, 30, 0, 2 * PI, 80), seg(56, 30, 46, 100, 32)] }
  ];

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("mark");
  var g = document.createElementNS(NS, "g");
  g.setAttribute("transform", "translate(39,46)");

  var phase = 0;
  letters.forEach(function (letter) {
    letter.strokes.forEach(function (stroke) {
      var pts = stroke.map(function (p) { return [p[0] + letter.x, p[1]]; });
      var el = document.createElementNS(NS, "path");
      el.setAttribute("d", toPath(wobble(pts, phase)));
      g.appendChild(el);
      phase += 1.1;
    });
  });

  svg.appendChild(g);
})();
</script>

</body>
</html>
